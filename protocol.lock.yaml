# Machine-readable mirror of the Experimental Freeze Document.
# Every run logs hash_obj(this file). The hash is FINAL only when
# freeze_status.pending is empty; src.utils.config.assert_frozen enforces
# that no full-scale experiment runs before then.
protocol_version: "1.0"
freeze_document: experimental_freeze_document.md

frozen:
  universe_rule: "top 20 S&P 500 by market cap @ 2021-12-31"
  track_a_window: ["2022-01-03", "2023-12-29"]
  track_b_window: ["2026-01-02", "2026-06-30"]
  calibration_window: ["2019-01-02", "2021-12-31"]
  execution: "news <= close(t); execute open(t+1)"
  costs_bps_per_side: [5, 10, 25]
  conditions: [original, anonymized, anonymized_shuffled_dates]
  density_criterion: { m1: 0.90, m2: 0.95, window_days: 3, max_failing: 5 }
  bootstrap: { B: 10000, block_days: 21, sensitivity: [5, 63], seed: 2026 }
  regime_bear_rule: "month-end >20% below running peak"
  kappa_guideline: 0.70
  spot_check_fraction: 0.10
  audit_budget: { total_usd: 200, audit_share: 0.30 }
  seeds: [11, 42, 2026]
  model: { repo: "Qwen/Qwen3-14B", precision: bf16, quantization: none }
  amendment_policy: "append-only log; data/infrastructure causes only"

# Values recorded at the Phase 3 pilot (2026-09-24); sources in configs/data.yaml
# and results/pilot/pilot_notes.md.
recorded:
  universe_tickers: [AAPL, MSFT, GOOGL, AMZN, TSLA, META, NVDA, BRK-B, UNH, V,
                     JPM, JNJ, HD, WMT, PG, BAC, MA, PFE, DIS, AVGO]
  fnspid: { dataset: Zihan1004/FNSPID, commit: bf9189c41527198897d1af3e17b1a0095279fc45,
            news_column_map: confirmed (Date, Stock_symbol, Article_title) }
  prices_crosscheck: tiingo            # Stooq blocks automated access; run pending API key

freeze_status:
  pending:
    - model.revision (record at download)
    - model.downloaded_date
    - inference.framework_version
    - track_b_news final configuration
    - audit sample N + human-validation N (budget rule + pilot cost)
  amendments:                         # append-only; see Freeze Document D.8
    - id: A-001
      date: "2026-07-09"
      category: instrument configuration correction
      change: "generation.temperature 0.0 -> 0.7; generation.top_p 1.0 -> 0.8"
      reason: "model validity: Qwen3 documentation advises against greedy
        decoding; recommended non-thinking-mode sampling adopted.
        Reproducibility preserved via fixed seeds, full call caching,
        revision pinning, and experiment logging."
      outcome_triggered: false
